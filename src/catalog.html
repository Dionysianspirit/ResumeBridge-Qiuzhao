<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>我的秋招投递 · 履历桥</title><link rel="stylesheet" href="catalog.css"></head>
<body>
  <header class="topbar"><div class="brand"><img src="../icons/icon48.png" alt=""><span>履历桥<span class="brand-sub">我的秋招投递</span></span></div><div class="top-actions"><button id="openResume" class="quiet">简历设置</button><button id="openRecords" class="quiet">全部投递记录</button><button id="exportCsv" class="quiet">导出当前列表</button><details class="backup-menu"><summary>数据备份</summary><div><button id="exportBackup">导出进度备份</button><button id="importBackup" class="quiet">导入进度备份</button><button id="importCatalog" class="quiet">导入招聘总表</button><button id="resetCatalog" class="quiet">恢复内置总表</button></div></details><input id="backupFile" type="file" accept=".json,application/json" hidden><input id="catalogFile" type="file" accept=".json,application/json" hidden></div></header>
  <div class="app-layout">
    <aside class="sidebar"><p class="sidebar-label">招聘清单</p><nav id="views" aria-label="清单视图"></nav><div class="sidebar-note"><strong>一份清单，随投随记</strong><p>总表保留招聘信息。每投完一个具体岗位，记录一次，进度会同步到这里。</p></div></aside>
    <main>
      <div class="page-heading"><div><p class="eyebrow" id="snapshotLabel">正在读取你的清单</p><h1 id="viewTitle">本周优先</h1><p class="subheading" id="sourceSummary">加载中…</p></div><button id="refresh" class="quiet">刷新进度</button></div>
      <section class="metrics" aria-label="投递概况"><button data-view="unsubmitted"><span>还没投递</span><strong id="countPending">—</strong><small>未过期、尚未记录投递</small></button><button data-view="submitted"><span>已经投过</span><strong id="countSubmitted">—</strong><small>至少记录了一个具体岗位</small></button><button data-view="weekly"><span>本周优先清单</span><strong id="countWeekly">—</strong><small>保留原表的加急顺序</small></button><button id="showDue"><span>7 天内截止</span><strong id="countDue">—</strong><small>尚未投递的明确截止条目</small></button></section>
      <section class="workspace" aria-label="招聘信息表">
        <div class="filters"><label class="search"><span>搜索公司、岗位、城市或备注</span><input id="search" type="search" placeholder="试试：产品运营、北京、央国企"></label><label><span>档位</span><select id="tier"><option value="">全部档位</option><option value="A">A · 难</option><option value="B">B</option><option value="C">C · 稳</option><option value="D">D</option></select></label><label><span>截止范围</span><select id="due"><option value="">全部</option><option value="7">7 天内截止</option><option value="rolling">招满为止</option></select></label><label><span>排序</span><select id="sort"><option value="priority">原表优先顺序</option><option value="deadline">截止日期由近到远</option><option value="company">公司名称</option><option value="updated">最近更新</option></select></label></div>
        <div class="list-caption"><p id="resultCount">正在加载…</p><p>点击公司查看全部原始信息</p></div>
        <div class="table-wrap"><table><thead><tr><th>公司 / 批次</th><th>招聘岗位</th><th>工作地点</th><th>截止信息</th><th>我的进度</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden><strong>没有符合条件的条目</strong><p>可以切换视图或清空筛选条件。</p><button id="resetFilters" class="quiet">清空筛选</button></div></div>
        <div class="pagination"><span id="pageLabel"></span><div><button id="previous" class="quiet">上一页</button><button id="next" class="quiet">下一页</button></div></div>
      </section>
      <p id="feedback" class="feedback" role="status"></p><p class="footnote">截止提醒按原表日期计算；“招满为止”和岗位是否仍开放，需要以招聘官网为准。</p>
    </main>
  </div>
  <dialog id="detailDialog" aria-labelledby="detailTitle"><div class="dialog-head"><div><p id="detailBatch" class="eyebrow"></p><h2 id="detailTitle"></h2></div><button id="closeDetail" class="quiet" aria-label="关闭详情">关闭</button></div><div class="dialog-body"><div class="detail-actions"><button id="detailOpen">打开投递页面</button><a id="noticeLink" class="button quiet" target="_blank" rel="noreferrer noopener">官方公告</a><span id="detailDeadline"></span></div><p id="detailSource" class="muted"></p><div class="detail-grid"><section><h3>招聘岗位</h3><p id="detailRoles" class="long-text"></p><h3>工作地点</h3><p id="detailLocation" class="long-text"></p><details class="source-fields"><summary>查看原表全部字段及来源</summary><dl id="sourceFields"></dl><div id="sourceVariants"></div></details></section><section class="personal-column"><form id="noteForm"><h3>我的准备与跟进</h3><label>准备状态<select id="noteDecision"><option>未投递</option><option>准备中</option><option>已放弃</option></select></label><label>计划投递岗位<input id="targetRole" maxlength="240" placeholder="可选：确认想投的具体岗位后填写"></label><label>下次跟进日期<input id="followUpDate" type="date"></label><label>个人备注<textarea id="noteText" rows="3" maxlength="8000" placeholder="内推联系人、材料准备、下一步安排…"></textarea></label><button id="saveNote" class="quiet" type="submit">保存准备信息</button></form><section class="record-section"><h3>已投岗位 <span id="recordCount"></span></h3><div id="detailRecords"></div><details id="recordDetails"><summary>记录一个已投岗位</summary><form id="recordForm"><p class="muted">提交申请后再记录。每个具体岗位各记一条。</p><label>具体岗位<input id="recordRole" required maxlength="240" placeholder="填写你实际提交的岗位名称"></label><label>投递时间<input id="recordDate" type="datetime-local" required></label><label>当前进度<select id="recordStatus"></select></label><label>使用的简历<select id="recordResume"></select></label><button id="saveRecord" type="submit">保存投递记录</button></form></details></section></section></div><p id="detailFeedback" class="feedback" role="status"></p></div></dialog>
  <script src="job-tracker.js"></script><script src="catalog-model.js"></script><script src="catalog.js"></script>
</body></html>
